<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVID-19 Cases in the U.S.</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
          rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
          crossorigin="anonymous">
    <link href="covid19.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
            crossorigin="anonymous"></script>
    <script src="covid19.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="js/lineChart.js" defer></script>
</head>
<body class="background">
    <div class="container w-25 covid-table">
        <table class="table table-hover table-sm table-light">
            <thead class="table-dark">
              <tr>
                <th class = "state" scope="col">State</th>
                <th class = "positives" scope="col">COVID-19 Positive Cases (6/13/20)</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
    </div>
    <section class="mt-4">
      <div class="container d-flex overflow-hidden bg-light rounded-4" id="chart-wrapper">
        <canvas id="chart" class="m-5"></canvas>
      </div>
    </section>
    <div class="card w-50 container-fluid mt-4 p-3">
      <h5>Average of Positive Cases:</h5>
      <p id="positiveAvg"></p>
      <h5>Average of Currently Hospitalized:</h5>
      <p id="hospitalizedAvg"></p>
    </div>
</body>
</html>
